answers:

  # Task 1.3 — Step 1: Diagnosing missing spans and context propagation
  # Diagnose the trace boundary using the before capture and the supplied source excerpts.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # boundary options (use exact values):
  # - api-to-queue-to-worker: The handoff from API publishing through the queue to worker
  #   processing.
  # - worker-to-model: The connection between worker processing and the model call.
  # - api-to-database: The connection between API handling and database access.
  #
  # carrier options (use exact values):
  # - not-injected-or-restored: Trace context is not injected into or restored from the queue
  #   carrier.
  # - propagated-correctly: Trace context is carried through the handoff and restored for
  #   processing.
  # - invalid-job-json: The queued job payload is not valid JSON.
  #
  # worker_context options (use exact values):
  # - not-extracted: The processing span is started without extracting the incoming trace context.
  # - extracted-parent: The processing span uses the parent extracted from incoming trace context.
  # - no-worker-tracer: The worker has no tracer for creating its processing span.
  #
  # causal_claim options (use exact values):
  # - observation: A fact directly present in a supplied record or source excerpt.
  # - inference: An explanation drawn from the supplied evidence.
  # - not-established: The claim needs evidence that the supplied records do not provide.
  trace_diagnosis:
    # Faulty context propagation boundary.
    # Choose one string from the boundary options above.
    boundary:
    # Cause visible in queue source.
    # Choose one string from the carrier options above.
    carrier:
    # How the starter creates the processing span.
    # Choose one string from the worker_context options above.
    worker_context:
    # Classify the explanation that these source defects cause separate runtime traces.
    # Choose one string from the causal_claim options above.
    causal_claim:

  # Task 1.3 — Step 1: Diagnosing missing spans and context propagation
  # Diagnose the before capture: observation conversion, growing metric dimensions, and their
  # effect.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # unit_fault options (use exact values):
  # - seconds-multiplied-by-1000: The code multiplies a duration in seconds by 1000 before recording
  #   it.
  # - seconds-divided-by-1000: The code divides a duration in seconds by 1000 before recording it.
  # - correct-seconds: The code records the duration in seconds without changing its unit.
  #
  # cardinality_fault options (use exact values):
  # - per-exception-request-id: A label uses an identifier that differs between exceptions.
  # - bounded-route: A label uses one of a limited set of route names.
  # - none: No application label or dimension of the kind asked about is present.
  #
  # impact options (use exact values):
  # - new-series-per-exception-and-inflated-duration: Each exception adds a series and recorded
  #   durations exceed the intended seconds values.
  # - missing-database-row: The application record is absent from the database.
  # - no-impact: The defects have no effect on the behavior being assessed.
  metric_diagnosis:
    # Starter observation conversion.
    # Choose one string from the unit_fault options above.
    unit_fault:
    # Starter dimension responsible for growth.
    # Choose one string from the cardinality_fault options above.
    cardinality_fault:
    # Effect of the combined defects.
    # Choose one string from the impact options above.
    impact:

  # Task 1.3 — Step 1: Diagnosing missing spans and context propagation
  # Interpret trace continuity, the model span parent, and record correlation in the before capture.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # continuity options (use exact values):
  # - single-parent-chain: Publisher and processing spans belong to one trace with the expected
  #   parent link.
  # - separate-traces: Source and target spans use different trace IDs.
  # - no-worker-span: No worker processing span is present in the supplied capture.
  #
  # model_parent options (use exact values):
  # - worker-processing: The model span's parent is the worker processing span.
  # - api-request: The model span's parent is the API request span.
  # - no-parent: The model span has no parent reference.
  #
  # correlation_basis options (use exact values):
  # - exception-id: Match the same durable exception identifier across records.
  # - timestamp-proximity: Associate records because their timestamps are close together.
  # - no-shared-identity: No common identifier links the supplied records.
  #
  # classification options (use exact values):
  # - observation: A fact directly present in a supplied record or source excerpt.
  # - inference: An explanation drawn from the supplied evidence.
  # - not-established: The claim needs evidence that the supplied records do not provide.
  before_trace_evidence:
    # Compare actual publisher and processing span trace IDs and CHILD_OF references.
    # Choose one string from the continuity options above.
    continuity:
    # Parent of model_provider.summarize.
    # Choose one string from the model_parent options above.
    model_parent:
    # Shared durable identity linking HTTP, stream, worker and saved record.
    # Choose one string from the correlation_basis options above.
    correlation_basis:
    # Classification of the trace relationship directly visible in this capture.
    # Choose one string from the classification options above.
    classification:

