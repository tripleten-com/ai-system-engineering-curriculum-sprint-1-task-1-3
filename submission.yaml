  # Task 1.3 — Step 3: Repairing metric cardinality and dashboard defects
  # Compare business outcomes across the supplied before/after captures and classify the claims
  # those records support.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # exception_state options (use exact values):
  # - COMPLETED: The exception job has finished successfully.
  # - FAILED: The exception job has reached a failed state.
  # - QUEUED: The exception job is waiting for processing.
  #
  # normal_http_status options (use exact values):
  # - 200: HTTP OK: the request succeeded.
  # - 202: HTTP Accepted: the request was accepted for processing.
  # - 422: HTTP Unprocessable Content: the request content failed validation.
  # - 500: HTTP Internal Server Error: the server encountered an error.
  #
  # summary_comparison options (use exact values):
